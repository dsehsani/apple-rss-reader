# Prerequisites (us-west-2):
#   1. Secret `openrss/gemini-api-key` — legacy /v1/chat (Gemini). Will be removed once cutover lands.
#   2. Secret `openrss/anthropic-api-key` — new /v1/agent (Claude Haiku 4.5 + Sonnet 4.6).
service: openrss-chat

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  environment:
    DB_HOST: ${env:PAYAM_DB_HOST, ''}
    DB_PORT: '5432'
    DB_NAME: payam
    DB_USER: payam
    DB_PASSWORD: ${env:PAYAM_DB_PASSWORD, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - arn:aws:secretsmanager:us-west-2:${aws:accountId}:secret:openrss/gemini-api-key-*
            - arn:aws:secretsmanager:us-west-2:${aws:accountId}:secret:openrss/anthropic-api-key-*

functions:
  payamChat:
    name: payam-chat
    handler: handler.main
    events:
      - httpApi:
          path: /v1/chat
          method: post

  payamAgent:
    name: payam-agent
    handler: src/agent.main
    timeout: 30
    events:
      - httpApi:
          path: /v1/agent
          method: post

package:
  patterns:
    - '!.git/**'
