name: Discovery Feed Health

# Monthly check of the static Discover catalog (RSSCatalog.swift / catalog.mjs).
# Fetches every catalog feed, classifies DEAD / STALE (>90d) / OK, writes a job
# summary, and opens/updates a single GitHub issue when feeds need attention.

on:
  schedule:
    # 09:00 UTC on the 1st of each month.
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: Check catalog feeds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install payam-polling deps
        working-directory: payam-polling
        run: npm ci

      - name: Run catalog health check
        id: check
        working-directory: payam-polling
        # Capture the markdown report and the checker's exit status without
        # failing the step (so we can branch on the result below).
        run: |
          set +e
          node scripts/check-catalog-health.mjs > report.md 2> err.log
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
          {
            echo 'report<<REPORT_EOF'
            cat report.md
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open or update health issue
        if: steps.check.outputs.status != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const report = process.env.REPORT;
            const title = 'Discovery feed health: feeds need attention';
            const label = 'feed-health';

            // Ensure the label exists (ignore "already exists" errors).
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'd93f0b',
                description: 'Automated Discover catalog feed health reports',
              });
            } catch (e) { /* label already exists */ }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });

            const body = `${report}\n\n_Generated by the \`Discovery Feed Health\` workflow on ${new Date().toISOString().slice(0, 10)}. ` +
              `Fix by replacing the listed URLs in \`Payam/Models/RSSCatalog.swift\` and \`payam-chat/src/catalog.mjs\` (keep them in sync)._`;

            if (existing.data.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
        env:
          REPORT: ${{ steps.check.outputs.report }}
