service: payam-cloud

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: ${opt:stage, 'dev'}
  httpApi:
    metrics: true
  environment:
    DB_HOST: ${env:PAYAM_DB_HOST, ''}
    DB_PORT: '5432'
    DB_NAME: payam
    DB_USER: payam
    DB_PASSWORD: ${env:PAYAM_DB_PASSWORD, ''}
    JWT_SECRET: ${env:PAYAM_JWT_SECRET, ''}
    SECRETS_ARN: ${env:PAYAM_SECRETS_ARN, ''}
    USERS_TABLE: payam-users-${self:provider.stage}
    DEVICE_TOKENS_TABLE: payam-device-tokens-${self:provider.stage}
    EXTRACTION_INDEX_TABLE: payam-extraction-index-${self:provider.stage}
    EXTRACTION_BUCKET: payam-extractions-${self:provider.stage}
    FEED_POLL_QUEUE_URL: !Ref FeedPollQueue
    EXTRACTION_QUEUE_URL: https://sqs.us-west-2.amazonaws.com/100731996760/payam-extraction-dev.fifo
    EXTRACTION_LIGHT_QUEUE_URL: !Ref ExtractionLightQueue
    SNS_PLATFORM_ARN: ${env:PAYAM_SNS_PLATFORM_ARN, ''}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:UpdateItem
          Resource:
            - !GetAtt UsersTable.Arn
            - !GetAtt DeviceTokensTable.Arn
            - !GetAtt ExtractionIndexTable.Arn
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:SendMessageBatch
          Resource:
            - !GetAtt FeedPollQueue.Arn
            - !GetAtt ExtractionLightQueue.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource:
            - arn:aws:s3:::payam-extractions-${self:provider.stage}/*
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: '*'
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource:
            - ${env:PAYAM_SECRETS_ARN, 'arn:aws:secretsmanager:us-west-2:*:secret:payam/*'}

functions:
  # --- Auth ---
  authApple:
    handler: src/auth.main
    timeout: 10
    events:
      - httpApi:
          path: /v1/auth/apple
          method: post

  # --- Device Registration ---
  deviceRegister:
    handler: src/device-register.main
    timeout: 5
    events:
      - httpApi:
          path: /v1/devices/register
          method: post

  # --- Feed Sync ---
  riverSync:
    handler: src/river-sync.main
    timeout: 15
    reservedConcurrency: 5
    events:
      - httpApi:
          path: /v1/river
          method: get

  stateSync:
    handler: src/state-sync.main
    timeout: 10
    reservedConcurrency: 3
    events:
      - httpApi:
          path: /v1/state
          method: post

  # --- Feed Subscriptions ---
  feeds:
    handler: src/feeds.main
    timeout: 10
    reservedConcurrency: 3
    events:
      - httpApi:
          path: /v1/feeds
          method: post

  # --- Feed Polling ---
  feedOrchestrator:
    handler: src/feed-orchestrator.main
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: true

  feedWorker:
    handler: src/feed-worker.main
    timeout: 30
    reservedConcurrency: 5
    events:
      - sqs:
          arn: !GetAtt FeedPollQueue.Arn
          batchSize: 1

  # --- Extraction Cache ---
  extractProxy:
    handler: src/extract-proxy.main
    timeout: 10
    events:
      - httpApi:
          path: /v1/extract/{hash}
          method: get

  extractLight:
    handler: src/extract-light.main
    timeout: 30
    memorySize: 512
    reservedConcurrency: 3
    events:
      - sqs:
          arn: !GetAtt ExtractionLightQueue.Arn
          batchSize: 5

  # --- Discovery ---
  discover:
    handler: src/discover.main
    timeout: 10
    reservedConcurrency: 3
    events:
      - httpApi:
          path: /v1/discover
          method: post

  # --- Feed Enrichment ---
  # --- Cleanup ---
  cleanup:
    handler: src/cleanup.main
    timeout: 60
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 day)
          enabled: true

  # --- Feed Enrichment ---
  enrichFeeds:
    handler: src/enrich-feeds.main
    timeout: 120
    reservedConcurrency: 1
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true

resources:
  Resources:
    # --- DynamoDB Tables ---
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: payam-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH

    DeviceTokensTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: payam-device-tokens-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH

    ExtractionIndexTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: payam-extraction-index-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: urlHash
            AttributeType: S
        KeySchema:
          - AttributeName: urlHash
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # --- SQS Queues ---
    FeedPollQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payam-feed-poll-${self:provider.stage}
        VisibilityTimeout: 60
        MessageRetentionPeriod: 3600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt FeedPollDLQ.Arn
          maxReceiveCount: 3

    FeedPollDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payam-feed-poll-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    ExtractionLightQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payam-extraction-light-${self:provider.stage}
        VisibilityTimeout: 120
        MessageRetentionPeriod: 3600
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ExtractionLightDLQ.Arn
          maxReceiveCount: 3

    ExtractionLightDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: payam-extraction-light-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    # --- API Gateway Throttling ---
    HttpApiStage:
      Type: AWS::ApiGatewayV2::Stage
      Properties:
        ApiId: !Ref HttpApi
        StageName: $default
        AutoDeploy: true
        DefaultRouteSettings:
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

    # --- S3 Bucket ---
    ExtractionBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: payam-extractions-${self:provider.stage}
        LifecycleConfiguration:
          Rules:
            - Id: expire-72hr
              Status: Enabled
              ExpirationInDays: 3

    # --- CloudWatch Alarms ---
    LambdaErrorAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: payam-lambda-errors-${self:provider.stage}
        AlarmDescription: Fires when any Lambda function errors exceed 10 in 5 minutes
        Namespace: AWS/Lambda
        MetricName: Errors
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 10
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

    FeedPollQueueDepthAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: payam-feed-poll-depth-${self:provider.stage}
        AlarmDescription: Feed poll queue backing up (>100 messages visible)
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt FeedPollQueue.QueueName
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 2
        Threshold: 100
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

    ExtractionQueueDepthAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: payam-extraction-depth-${self:provider.stage}
        AlarmDescription: Extraction queue backing up (>200 messages visible)
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ExtractionLightQueue.QueueName
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 2
        Threshold: 200
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching

package:
  patterns:
    - '!.git/**'
    - '!sql/**'
    - '!node_modules/.cache/**'
